# actions/labeler v5 configuration schema.
docs:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md']
tests:
  - changed-files:
      - any-glob-to-any-file: ['tests/**']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']
ports:
  - changed-files:
      - any-glob-to-any-file: ['ports/**']
demos:
  - changed-files:
      - any-glob-to-any-file: ['demos/**']
matchmaking:
  - changed-files:
      - any-glob-to-any-file:
          - 'dealflow/matching.py'
          - 'dealflow/capital_sources.py'
          - 'dealflow/teaming.py'
          - 'dealflow/opps.py'
          - 'dealflow/reports.py'
